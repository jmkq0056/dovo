name: Maut Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # serialize postinstall's sub-installs — extensions/ and
  # extensions/mermaid-chat-features race over extensions/node_modules
  VSCODE_INSTALL_CONCURRENCY: "1"
  # builtin-extension downloads hit api.github.com — anonymous calls get
  # rate-limited (403) on shared runner IPs
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm dependencies
        shell: bash
        run: npm ci || npm ci

      # Packaging copies each built-in extension's out/ as-is, so compile them first.
      - name: Compile built-in extensions
        run: npm run gulp compile-extensions

      - name: Build win32-x64
        run: npm run gulp vscode-win32-x64

      - name: Build installer
        run: |
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup

      - name: Collect installer and portable zip
        shell: pwsh
        run: |
          $setup = Get-ChildItem .build/win32-x64/user-setup -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer in .build/win32-x64/user-setup" }
          Copy-Item $setup.FullName Maut-code-Setup-x64.exe
          Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath Maut-code-win-x64.zip
          Get-Item Maut-code-Setup-x64.exe, Maut-code-win-x64.zip | Format-Table Name, Length

      # Install exactly the way users do (docs/install.ps1), then check the app and CLI landed.
      - name: Test the one-line installer
        shell: pwsh
        env:
          MAUT_INSTALLER: Maut-code-Setup-x64.exe
          MAUT_NO_OPEN: "1"
        run: |
          ./docs/install.ps1
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Maut code'
          if (-not (Test-Path "$app\Maut code.exe")) { throw "Maut code.exe not installed" }
          if (-not (Test-Path "$app\bin\maut-code.cmd")) { throw "maut-code CLI not installed" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*Maut code\bin*") { throw "maut-code is not on PATH" }
          & "$app\bin\maut-code.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "maut-code --version failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: maut-code-windows-x64
          path: |
            Maut-code-Setup-x64.exe
            Maut-code-win-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Maut-code-Setup-x64.exe
            Maut-code-win-x64.zip

  mac-arm64:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: npm ci || npm ci

      - name: Compile built-in extensions
        run: npm run gulp compile-extensions

      - name: Build darwin-arm64
        run: npm run gulp vscode-darwin-arm64

      # Unsigned bundles are reported as "damaged" by macOS; ad-hoc signing lets them open.
      - name: Sign and build DMG
        run: |
          cd "${GITHUB_WORKSPACE}/../VSCode-darwin-arm64"
          codesign --force --deep --sign - "Maut code.app"
          hdiutil create -volname "Maut code" -srcfolder "Maut code.app" -ov -format UDZO "${GITHUB_WORKSPACE}/Maut-code-arm64.dmg"

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Maut-code-arm64.dmg
