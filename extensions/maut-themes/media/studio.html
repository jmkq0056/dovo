<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Dovo Theme Studio</title>
<style>
  :root {
    --bg: var(--vscode-sideBar-background);
    --fg: var(--vscode-sideBar-foreground);
    --muted: var(--vscode-descriptionForeground);
    --card: var(--vscode-editorWidget-background);
    --border: var(--vscode-panel-border);
    --accent: var(--vscode-focusBorder);
    --input-bg: var(--vscode-input-background);
    --input-fg: var(--vscode-input-foreground);
    --btn-bg: var(--vscode-button-background);
    --btn-fg: var(--vscode-button-foreground);
    --btn-hover: var(--vscode-button-hoverBackground);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 10px 32px 10px;
    font-family: var(--vscode-font-family);
    color: var(--fg); background: var(--bg);
    font-size: 12.5px; line-height: 1.45;
  }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px;
       color: var(--muted); margin: 0 0 8px 0; font-weight: 600; }
  .hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

  /* Mode tabs (Edit Light / Edit Dark) */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--card); border-radius: 8px; padding: 3px; margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .tab {
    border: 0; border-radius: 6px;
    background: transparent; color: var(--fg);
    padding: 9px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    position: relative;
  }
  .tab:hover { background: rgba(127,127,127,0.10); }
  .tab.editing {
    background: var(--btn-bg);
    color: #ffffff;
    box-shadow: 0 1px 4px -1px rgba(0,0,0,0.25);
  }
  .tab .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: transparent;
    box-shadow: inset 0 0 0 1px currentColor;
    opacity: 0.4;
  }
  .tab.active-mode .dot { background: #5fd47f; box-shadow: none; opacity: 1; }
  .tab.editing.active-mode .dot { background: #ffffff; }

  /* Active mode banner */
  .active-banner {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 12px; font-size: 11.5px;
  }
  .active-banner .pulse { width: 7px; height: 7px; border-radius: 50%; background: #5fd47f;
    box-shadow: 0 0 0 0 #5fd47f; animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(95,212,127,0.55); }
    70% { box-shadow: 0 0 0 6px rgba(95,212,127,0); }
    100% { box-shadow: 0 0 0 0 rgba(95,212,127,0); }
  }
  .active-banner .lbl { flex: 1; color: var(--muted); }
  .active-banner .mode-name { color: var(--fg); font-weight: 600; }
  .active-banner button {
    border: 1px solid var(--border); background: transparent; color: var(--fg);
    padding: 4px 9px; border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  .active-banner button:hover { border-color: var(--accent); }

  /* Section */
  .section { margin-bottom: 14px; }

  /* Presets */
  .preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 6px;
  }
  .preset {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; background: var(--card);
    cursor: pointer; display: flex; align-items: center; gap: 7px;
    transition: all .15s;
  }
  .preset:hover { border-color: var(--accent); transform: translateY(-1px); }
  .preset .sw {
    width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
    border: 1px solid rgba(127,127,127,0.2);
  }
  .preset .name { font-size: 11px; font-weight: 500; line-height: 1.1; }
  .preset .name small { color: var(--muted); font-size: 9.5px; display: block; font-weight: 500; }

  /* Controls */
  .control { margin-bottom: 10px; }
  .control label {
    display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 4px; font-weight: 500;
  }
  .control .row { display: flex; gap: 6px; align-items: center; }
  input[type="color"] {
    width: 42px; height: 30px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--card); cursor: pointer; padding: 2px;
  }
  input[type="text"], select, input[type="number"] {
    flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--input-bg); color: var(--input-fg);
    font-family: var(--vscode-font-family); font-size: 12px;
  }
  input[type="text"]:focus, select:focus, input[type="number"]:focus {
    outline: none; border-color: var(--accent);
  }
  input[type="range"] { flex: 1; accent-color: var(--btn-bg); }
  .hex { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; min-width: 60px; }
  .size-val { min-width: 28px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }

  /* Preview */
  .preview {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    transition: all .2s; overflow: hidden;
  }
  .preview .pv-title { font-size: 10.5px; color: var(--muted); margin-bottom: 6px; }
  .preview .pv-body { font-family: var(--pv-font); font-size: var(--pv-size); margin: 0; }
  .preview .pv-kw { color: var(--pv-accent); font-weight: 600; }
  .preview .pv-str { color: var(--pv-fg); opacity: 0.82; }
  .preview .pv-cm { color: var(--pv-muted); font-style: italic; }
  .preview .pv-btn {
    display: inline-block; margin-top: 8px;
    background: var(--pv-accent); color: white;
    padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
  }

  /* Saved themes */
  .saved-list { display: flex; flex-direction: column; gap: 4px; }
  .saved-row {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; background: var(--card);
    border: 1px solid var(--border); border-radius: 5px;
  }
  .saved-row .sw { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(127,127,127,0.2); }
  .saved-row .nm { flex: 1; font-size: 11.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-row .tags { color: var(--muted); font-size: 10px; }
  .saved-row button {
    background: transparent; border: 1px solid var(--border); color: var(--fg);
    padding: 3px 7px; border-radius: 3px; font-size: 10px; cursor: pointer;
  }
  .saved-row button:hover { border-color: var(--accent); }
  .saved-row button.del:hover { border-color: #e8465f; color: #e8465f; }
  .saved-empty { color: var(--muted); font-size: 11px; font-style: italic; padding: 6px 4px; }

  /* Action buttons */
  .actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .actions button {
    background: var(--btn-bg); color: var(--btn-fg); border: none;
    padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: 600;
  }
  .actions button:hover { background: var(--btn-hover); }
  .actions button.ghost {
    background: transparent; color: var(--fg); border: 1px solid var(--border);
  }
  .actions button.ghost:hover { border-color: var(--accent); }

  .save-row { display: flex; gap: 5px; }
  .save-row input { flex: 1; }
  .save-row button {
    background: var(--btn-bg); color: var(--btn-fg); border: none;
    padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: 600;
  }
  .save-row button:hover { background: var(--btn-hover); }
</style>
</head>
<body>

<div class="active-banner">
  <span class="pulse"></span>
  <span class="lbl">Active: <span class="mode-name" id="active-name">Dark</span></span>
  <button id="swap-active" title="Switch active mode (same as Shift+Cmd+L)">Swap</button>
</div>

<div class="tabs" id="tabs" role="tablist">
  <button class="tab" id="tab-light" data-mode="light" role="tab">
    <span class="dot"></span>
    <span>Light</span>
  </button>
  <button class="tab" id="tab-dark" data-mode="dark" role="tab">
    <span class="dot"></span>
    <span>Dark</span>
  </button>
</div>

<div class="section">
  <h2>Presets for <span id="editing-name">Dark</span></h2>
  <div class="preset-grid" id="presets"></div>
</div>

<div class="section">
  <h2>Colors</h2>
  <div class="control">
    <label>Accent — buttons, cursor, focus</label>
    <div class="row">
      <input type="color" id="accent">
      <span class="hex" id="accent-hex"></span>
    </div>
  </div>
  <div class="control">
    <label>Surface tone — window background</label>
    <div class="row">
      <input type="color" id="tint">
      <span class="hex" id="tint-hex"></span>
    </div>
  </div>
</div>

<div class="section">
  <h2>Typography (applies to whole UI)</h2>
  <div class="control">
    <label>Font family</label>
    <div class="row">
      <select id="font">
        <option value="JetBrains Mono, Menlo, Monaco, monospace">JetBrains Mono</option>
        <option value="Menlo, Monaco, 'Courier New', monospace">Menlo</option>
        <option value="Monaco, Menlo, monospace">Monaco</option>
        <option value="'SF Mono', Menlo, monospace">SF Mono</option>
        <option value="'Fira Code', Menlo, monospace">Fira Code</option>
        <option value="'Cascadia Code', Menlo, monospace">Cascadia Code</option>
        <option value="'Source Code Pro', Menlo, monospace">Source Code Pro</option>
        <option value="'IBM Plex Mono', Menlo, monospace">IBM Plex Mono</option>
        <option value="Consolas, 'Courier New', monospace">Consolas</option>
        <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">System UI (default)</option>
      </select>
    </div>
  </div>
  <div class="control">
    <label>Font size</label>
    <div class="row">
      <input type="range" id="size" min="10" max="22" step="1">
      <span class="size-val" id="size-val">13</span>
    </div>
  </div>
</div>

<div class="section">
  <h2>Preview</h2>
  <div class="preview" id="preview">
    <div class="pv-title">~/hello.ts</div>
    <pre class="pv-body" id="pv-body"><span class="pv-cm">// Dovo</span>
<span class="pv-kw">function</span> greet(name: <span class="pv-kw">string</span>) {
  <span class="pv-kw">return</span> <span class="pv-str">`hello, ${name}`</span>;
}</pre>
    <div class="pv-btn">Primary button</div>
  </div>
</div>

<div class="actions" style="margin-top:8px;">
  <button id="activate-this">Apply as active</button>
  <button class="ghost" id="reset">Reset</button>
</div>

<hr class="hr">

<div class="section">
  <h2>Save current mode as…</h2>
  <div class="save-row">
    <input type="text" id="save-name" placeholder="my warm dark">
    <button id="save-btn">Save</button>
  </div>
</div>

<div class="section">
  <h2>Your saved themes</h2>
  <div class="saved-list" id="saved"></div>
</div>

<hr class="hr">

<div class="actions">
  <button class="ghost" id="export">Export</button>
  <button class="ghost" id="import">Import…</button>
</div>

<script>
  const vscode = acquireVsCodeApi();

  let state = null;
  let presets = [];
  let named = [];
  // The mode tab the user is currently EDITING in the studio
  // (not necessarily the mode that's active in the workbench).
  let editing = 'dark';

  const $ = (id) => document.getElementById(id);

  function modeLabel(m) { return m === 'light' ? 'Light' : 'Dark'; }

  function setEditingTab(mode) {
    editing = mode;
    $('tab-light').classList.toggle('editing', mode === 'light');
    $('tab-dark').classList.toggle('editing', mode === 'dark');
    $('editing-name').textContent = modeLabel(mode);
    renderEditor();
    renderPresets();
  }

  function markActiveTab(active) {
    $('tab-light').classList.toggle('active-mode', active === 'light');
    $('tab-dark').classList.toggle('active-mode', active === 'dark');
    $('active-name').textContent = modeLabel(active);
  }

  function renderEditor() {
    if (!state) { return; }
    const snap = state[editing];
    $('accent').value = snap.accent;
    $('accent-hex').textContent = snap.accent;
    $('tint').value = snap.tint;
    $('tint-hex').textContent = snap.tint;
    $('font').value = snap.fontFamily;
    $('size').value = String(snap.fontSize);
    $('size-val').textContent = String(snap.fontSize);
    renderPreview(snap);
  }

  function renderPreview(snap) {
    const isLight = snap.mode === 'light';
    const fg = isLight ? '#1e1e22' : '#f0f0f8';
    const muted = isLight ? '#5a5a6a' : '#a8a8bb';
    const pv = $('preview');
    pv.style.setProperty('--pv-accent', snap.accent);
    pv.style.setProperty('--pv-fg', fg);
    pv.style.setProperty('--pv-muted', muted);
    pv.style.setProperty('--pv-font', snap.fontFamily);
    pv.style.setProperty('--pv-size', snap.fontSize + 'px');
    pv.style.background = snap.tint;
    pv.style.color = fg;
  }

  function readSnap() {
    return {
      mode: editing,
      accent: $('accent').value,
      tint: $('tint').value,
      fontFamily: $('font').value,
      fontSize: parseInt($('size').value, 10) || 13,
    };
  }

  function pushEdit() {
    if (!state) { return; }
    const snap = readSnap();
    state[editing] = snap;
    renderPreview(snap);
    vscode.postMessage({ type: 'edit', mode: editing, snap });
  }

  function renderPresets() {
    const c = $('presets'); c.innerHTML = '';
    const filtered = presets.filter(p => p.mode === editing);
    for (const p of filtered) {
      const el = document.createElement('div');
      el.className = 'preset';
      el.innerHTML =
        '<div class="sw" style="background:linear-gradient(135deg,' + p.accent + ' 50%,' + p.tint + ' 50%)"></div>' +
        '<div class="name">' + p.name + '<small>' + p.mode + '</small></div>';
      el.onclick = () => {
        const snap = { mode: editing, accent: p.accent, tint: p.tint, fontFamily: p.fontFamily, fontSize: p.fontSize };
        vscode.postMessage({ type: 'preset', mode: editing, snap });
      };
      c.appendChild(el);
    }
  }

  function renderSaved() {
    const c = $('saved'); c.innerHTML = '';
    if (!named.length) {
      const e = document.createElement('div');
      e.className = 'saved-empty';
      e.textContent = 'None yet. Tweak controls, name it, hit Save.';
      c.appendChild(e);
      return;
    }
    for (const t of named) {
      const row = document.createElement('div');
      row.className = 'saved-row';
      row.innerHTML =
        '<div class="sw" style="background:linear-gradient(135deg,' + t.accent + ' 50%,' + t.tint + ' 50%)"></div>' +
        '<div class="nm">' + escapeHtml(t.name) + '<span class="tags"> · ' + t.mode + '</span></div>' +
        '<button class="apply">Apply</button>' +
        '<button class="del">×</button>';
      row.querySelector('.apply').onclick = () => {
        const snap = { mode: t.mode, accent: t.accent, tint: t.tint, fontFamily: t.fontFamily, fontSize: t.fontSize };
        vscode.postMessage({ type: 'applyNamed', mode: t.mode, snap });
      };
      row.querySelector('.del').onclick = () => {
        vscode.postMessage({ type: 'deleteNamed', name: t.name });
      };
      c.appendChild(row);
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // wiring
  $('accent').addEventListener('input', pushEdit);
  $('tint').addEventListener('input', pushEdit);
  $('font').addEventListener('change', pushEdit);
  $('size').addEventListener('input', () => { $('size-val').textContent = $('size').value; pushEdit(); });
  $('tab-light').onclick = () => setEditingTab('light');
  $('tab-dark').onclick = () => setEditingTab('dark');

  $('activate-this').onclick = () => {
    vscode.postMessage({ type: 'activate', mode: editing });
  };
  $('swap-active').onclick = () => {
    const next = (state && state.active === 'light') ? 'dark' : 'light';
    vscode.postMessage({ type: 'activate', mode: next });
  };

  $('save-btn').onclick = () => {
    const name = ($('save-name').value || '').trim();
    if (!name) { return; }
    vscode.postMessage({ type: 'saveAs', name, snap: readSnap() });
    $('save-name').value = '';
  };

  $('reset').onclick = () => vscode.postMessage({ type: 'reset', mode: editing });
  $('export').onclick = () => vscode.postMessage({ type: 'export' });
  $('import').onclick = () => {
    const txt = prompt('Paste theme JSON:');
    if (txt) { vscode.postMessage({ type: 'import', json: txt }); }
  };

  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (m.type === 'state') {
      state = m.state;
      named = m.named || [];
      presets = m.presets || [];
      markActiveTab(state.active);
      // First time we hear from the host, default to editing the active mode.
      if (!editing || (editing !== 'light' && editing !== 'dark')) {
        editing = state.active;
      }
      setEditingTab(editing);
      renderSaved();
    }
  });
</script>
</body>
</html>
